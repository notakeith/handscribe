  </g>
  <rect x="50" y="50" width="48" height="68" rx="2" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="0.75" stroke-dasharray="4 3"/>
  <g fill="#0284c7" fill-opacity="0.9">
    <rect x="48" y="48" width="4" height="4"/>
    <rect x="96" y="48" width="4" height="4"/>
    <rect x="48" y="116" width="4" height="4"/>
    <rect x="96" y="116" width="4" height="4"/>
  </g>

  <g stroke="#000000" stroke-opacity="0.32" stroke-width="1.2" fill="none" stroke-linecap="round">
